name: medical_qr_admin
description: تطبيق دسكتوب إدارة منصة الرمز الطبي العراقي
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  http: ^1.5.0
  file_picker: ^8.3.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_mark.png
    - assets/brand/logo_full.png
    - assets/brand/logo_splash.png
