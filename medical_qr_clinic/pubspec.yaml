name: medical_qr_clinic
description: تطبيق المريض والطبيب — الرمز الطبي العراقي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  http: ^1.5.0
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  fl_chart: ^0.70.2
  zxing2: ^0.2.3
  image: ^4.5.4
  lottie: ^3.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# أيقونة التطبيق: شعار MED QR نفسه على خلفية بيضاء، مع طبقة تكيّفية وأخرى أحادية اللون.
# التوليد: dart run tool/generate_brand_assets.dart ثم dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/app_icon.png
  android: true
  ios: false
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/brand/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#F7FBFC"
    theme_color: "#157A96"
  windows:
    generate: true
    image_path: assets/brand/app_icon.png
    icon_size: 256

# شاشة البداية الأصلية: الرمز في المنتصف وكلمة MED QR أسفل الشاشة.
# تبقى فاتحة دائماً لأن كلمة الشعار داكنة، ولتطابق شاشة البداية داخل التطبيق.
# التوليد: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F7FBFC"
  image: assets/brand/splash_mark.png
  branding: assets/brand/wordmark.png
  branding_mode: bottom
  branding_bottom_padding: 48
  android: true
  ios: false
  web: false
  android_12:
    image: assets/brand/splash_android12.png
    icon_background_color: "#FFFFFF"
    color: "#F7FBFC"
    branding: assets/brand/wordmark.png

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/doctores-freepik.json
    - assets/brand/logo_mark.png
    - assets/brand/logo_full.png
    - assets/brand/wordmark.png
    - assets/doctors/doctor_ahmed.jpg
    - assets/doctors/doctor_sara.jpg
    - assets/doctors/doctor_hussein.jpg
    - assets/doctors/doctor_nora.jpg
    - assets/icons/
    - assets/illustrations/
